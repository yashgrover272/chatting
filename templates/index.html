<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2f4f0">
    <title>Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='chat.js') }}" defer></script>
  </head>
  <body>
    <main class="chat-app">
      <header class="topbar">
        <h1>Chat</h1>
        <div class="topbar-actions">
          <span id="connection-status" role="status">Connecting</span>
          <button class="share-button" id="copy-link" type="button">Copy invite link</button>
        </div>
      </header>

      <section class="conversation" aria-label="Conversation">
        <div class="identity-row">
          <label for="person-name">Your name</label>
          <input id="person-name" maxlength="40" autocomplete="nickname" required>
        </div>
        <ol id="messages" class="messages" aria-live="polite" aria-relevant="additions"></ol>
        <form id="message-form" class="message-form">
          <label class="visually-hidden" for="message-input">Message</label>
          <textarea id="message-input" maxlength="2000" rows="1" placeholder="Write a message" required></textarea>
          <button id="send-button" type="submit">Send</button>
        </form>
      </section>
    </main>
  </body>
</html>
